<!-- src/web/templates/events.html -->
{% extends "base.html" %}
{# Журнал агрегированных импортов и операторских событий; не содержит confidential XML. #}
{% block content %}<section class="panel panel--padded" data-history-panel><h1>Журнал событий</h1><p data-history-access>Проверка операторских полномочий…</p><div class="history-filters"><label>Журнал<select class="input" data-history-kind><option value="imports">Обновления каталога</option><option value="audit">Действия оператора</option></select></label><label>Статус<select class="input" data-history-state><option value="">Все</option><option value="complete">Успешно</option><option value="failed">Ошибка</option><option value="indexing">Индексация</option><option value="queued">В очереди</option></select></label><label>Источник<select class="input" data-history-source><option value="">Все</option><option value="local_xml">Локальный XML</option><option value="http_onec">HTTP API 1С</option></select></label><button class="button" type="button" data-history-refresh>Обновить</button></div><div data-history-items></div><p class="panel__empty" data-history-empty>Нет данных для отображения</p><div class="panel__foot"><span data-history-page></span><div class="pagination"><button class="button" type="button" data-history-prev disabled>Назад</button><button class="button" type="button" data-history-next disabled>Вперёд</button></div></div></section>{% endblock %}
